version: '3.8'

services:
  tezisy:
    build: .
    container_name: tezisy-app
    ports:
      - "5001:5000"
    environment:
      - SECRET_KEY=change-me-in-production
      - PORT=5000
      - FLASK_DEBUG=0
      - URL_PREFIX=/tezisy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  uploads:
