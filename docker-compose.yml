version: '3.8'

services:
  tezisy:
    build: .
    container_name: tezisy-app
    ports:
      - "5001:5000"
    environment:
      - SECRET_KEY=change-me-in-production
      - PORT=5000
      - FLASK_DEBUG=0
      - URL_PREFIX=/tezisy
      - ADMIN_PASSWORD=tezisy-admin-2024
    volumes:
      - uploads:/app/uploads
      - data:/app/data
    restart: unless-stopped

volumes:
  uploads:
  data:
